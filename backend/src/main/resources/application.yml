server:
  port: 8080

spring:
  application:
    name: inventario-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventario}
    username: ${SPRING_DATASOURCE_USERNAME:inventario_user}
    password: ${SPRING_DATASOURCE_PASSWORD:inventario_pass}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
